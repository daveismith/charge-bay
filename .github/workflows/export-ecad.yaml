name: Export ECAD
on:
  push:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  export-ecad:
    name: Export ECAD
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad9_auto:1.9.0
    steps:

    - name: Update system repositories, Install Required Libraries and Initialize git-lfs
      run: |
        apt update
        apt -y install git git-lfs zip librsvg2-bin imagemagick
        git lfs install

    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        lfs: true

    - name: Update the PCBs with git hash
      run: |
        export COMMIT=$(git rev-parse --short HEAD)
        echo "COMMIT = ${COMMIT}"    
        echo "ref: ${{ github.ref }}"
        echo "default: ${{ env.default }}"
        find . -name '*.kicad_pcb' -exec sed -i "s!<<hash>>!${COMMIT}!" {} \;

    - name: Generate Export Files
      uses: INTI-CMNB/KiBot@v2_k9_1_9_0
      with:
          config: .github/workflows/scripts/kibot/config.kibot.yaml
          schema: charge_bay.kicad_sch
          board: charge_bay.kicad_pcb
          dir: output

    - name: Upload Export Files as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: charge-bay
        path: output
        if-no-files-found: error
        retention-days: 60

    - name: Upload Export Files as Release Assets
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: output/**/*
        fail_on_unmatched_files: true
